; DART 대시보드 설정 파일
; 인증키는 여기 넣지 않습니다: 내 컴퓨터는 dart_key.txt, GitHub는 Secrets의 DART_API_KEY

[collect]
; 종목코드(6자리)를 쉼표로 구분 (아이디스홀딩스, 아이디스, 코텍, 빅솔론)
companies = 054800, 143160, 052330, 093190
first_year = 2015
last_year = 2025
; CFS = 연결 우선(없으면 별도), OFS = 별도만
fs_div = CFS

[peers]
; auto = DART 업종코드가 같은 상장사로 비교 그룹 자동 구성, off = 업종 중앙값 생략
mode = auto
; 비교 그룹이 이보다 적으면 업종코드를 한 자리 짧게 잘라 넓힌다
min_peers = 5
; 비교 그룹 최대 회사 수 (자산총계가 비슷한 순으로 고름)
max_peers = 15

; ── 회사별 비교 그룹 직접 지정 (적힌 회사만 자동 대신 이 목록을 씀) ──
;   우리회사 종목코드 = 비교할 종목코드, ksic:업종코드, -제외할 종목코드  (쉼표로 구분, 섞어 써도 됨)
;   ksic:26429  → 업종코드가 26429로 시작하는 유가·코스닥 상장사 전부
;   -143160     → 목록에서 빼기 (예: 연결에 이미 포함된 자회사)
; 아이디스홀딩스: 영상보안(한화비전·트루엔·포커스에이아이·슈프리마·슈프리마에이치큐·인콘)
;                + 아이디스·코텍 업종, 자회사인 아이디스·코텍은 제외
054800 = 489790, 417790, 331380, 236200, 094840, 083640, ksic:26429, ksic:26519, -143160, -052330
